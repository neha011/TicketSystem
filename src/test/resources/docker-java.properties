# docker-java client configuration for the integration-test suite (task 18).
#
# Testcontainers uses a bundled (shaded) docker-java client whose default Docker API version
# is 1.32. Docker Engine 25+ rejects that ("client version 1.32 is too old"; the local daemon
# reports a minimum of 1.40). docker-java reads this classpath docker-java.properties file, so
# pinning api.version here makes the Testcontainers-backed integration tests negotiate an API
# version the modern daemon accepts. Committed to the test classpath so every developer and CI
# run picks it up rather than relying on a per-user ~/.docker-java.properties.
api.version=1.43
